name: CI

on:
  push:
    branches: [main, 'optimize/**']
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend · compile & unit tests
    runs-on: ubuntu-latest
    # 集成测试防假绿：IntegrationEnvGuardTest 要求 CI 必须提供真实 Redis + MySQL
    # （缺失即失败，不允许集成用例静默跳过）。
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: it_root_pw
          MYSQL_DATABASE: health_it
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pit_root_pw"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      IT_REDIS_HOST: 127.0.0.1
      IT_REDIS_PORT: '6379'
      IT_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/health_it?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      IT_MYSQL_USER: root
      IT_MYSQL_PASSWORD: it_root_pw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install upstream modules
        # -am 只会在 reactor 内构建上游模块，不会装进本地仓库；
        # 测试阶段 health-admin 解析 com.health:health-framework 时
        # 会去中央仓库找而失败（2026-09-06 的 CI 红叉即此原因）。
        # 先 install 一次，后续 test 便可直接复用本地仓库中的模块 jar。
        run: mvn -q -B -pl health-admin -am install -DskipTests
      - name: Unit tests (270 cases · state machine / governance / eval harness / red team)
        run: mvn -q -B -pl health-admin -am test

  frontend:
    name: Frontend · build & unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: health-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # vite 8（T7 升级）要求 Node 20.19+ / 22.12+
          node-version: '22'
          cache: npm
          cache-dependency-path: health-web/package-lock.json
      - run: npm ci
      - name: Unit tests (vitest)
        run: npm test
      - run: npm run build

  dependency-scan:
    name: Dependencies · OSS Index audit (CVSS>=7 fails)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # 轻量漏洞扫描：OSS Index 在线漏洞库（不需要下载 NVD 全量库），
      # 聚合全部 Maven 模块。门禁：CVSS>=7 即失败（高危无豁免不合并）。
      # 匿名请求可能限流，重试 3 次。
      - name: OSS Index audit
        run: |
          for i in 1 2 3; do
            mvn -q -B org.sonatype.ossindex.maven:ossindex-maven-plugin:3.2.0:audit -Dossindex.cvssScoreThreshold=7 && exit 0
            echo "attempt $i failed (可能是匿名限流), retrying in 30s..."
            sleep 30
          done
          exit 1
